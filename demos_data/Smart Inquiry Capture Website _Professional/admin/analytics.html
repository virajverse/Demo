<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - Smart Inquiry Admin</title>
    <link rel="stylesheet" href="admin-styles.css">
    <!-- Chart.js for charts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Advanced Code Protection -->
    <script src="../advanced-protection.js"></script>
</head>

<body>
    <!-- Sidebar -->
    <aside class="admin-sidebar" id="adminSidebar">
        <div class="sidebar-header">
            <h2>Smart Inquiry</h2>
            <span class="badge-pro">PRO</span>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <path d="M3 7l7-5 7 5v11H3V7z" stroke="currentColor" stroke-width="2" />
                </svg>
                Dashboard
            </a>
            <a href="bookings.html" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <rect x="3" y="4" width="14" height="14" rx="2" stroke="currentColor" stroke-width="2" />
                </svg>
                Bookings
                <span class="nav-badge">12</span>
            </a>
            <a href="staff.html" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <path d="M16 17v-2a4 4 0 00-8 0v2M12 7a4 4 0 11-8 0 4 4 0 018 0z" stroke="currentColor"
                        stroke-width="2" />
                </svg>
                Staff
            </a>
            <a href="analytics.html" class="nav-item active">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <path d="M3 17V9M9 17V3M15 17v-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                </svg>
                Analytics
            </a>
            <a href="ai-settings.html" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <path d="M10 3v14M3 10h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                    <circle cx="10" cy="10" r="3" stroke="currentColor" stroke-width="2" />
                </svg>
                AI Settings
            </a>
            <a href="crm-sync.html" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <path d="M4 12v5h5M16 8V3h-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                    <path d="M16 3l-6 6M4 17l6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                </svg>
                CRM Sync
            </a>
            <a href="locations.html" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <path d="M10 10m-3 0a3 3 0 106 0 3 3 0 10-6 0" stroke="currentColor" stroke-width="2" />
                    <path d="M10 2c-3.866 0-7 3.134-7 7 0 5.25 7 11 7 11s7-5.75 7-11c0-3.866-3.134-7-7-7z"
                        stroke="currentColor" stroke-width="2" />
                </svg>
                Locations
            </a>
            <a href="team-roles.html" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <path d="M14 6a4 4 0 11-8 0 4 4 0 018 0zM3 18a7 7 0 0114 0" stroke="currentColor"
                        stroke-width="2" />
                </svg>
                Team & Roles
            </a>
            <a href="whatsapp-templates.html" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <path d="M17 3H3v11h4l3 3 3-3h4V3zM7 8h6M7 11h4" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" />
                </svg>
                WhatsApp
            </a>
            <a href="settings.html" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <path
                        d="M10 12a2 2 0 100-4 2 2 0 000 4zM10 3v2m0 10v2m7-7h-2M5 10H3m12.07-5.07l-1.41 1.41M6.34 13.66l-1.41 1.41m9.9 0l-1.41-1.41M6.34 6.34L4.93 4.93"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                </svg>
                Settings
            </a>
        </nav>
        <button class="sidebar-logout" onclick="logout()">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                <path d="M7 17H3V3h4M13 13l4-3-4-3M17 10H7" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" />
            </svg>
            Logout
        </button>
    </aside>

    <!-- Main Content -->
    <main class="admin-main">
        <header class="admin-header">
            <button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
            <h1>Analytics</h1>
            <div class="header-actions">
                <div class="date-range-picker">
                    <button class="btn-secondary">Last 30 Days ▼</button>
                </div>
                <button class="header-btn" onclick="exportReport()" title="Export Report">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <path d="M4 16v1a2 2 0 002 2h8a2 2 0 002-2v-1M10 12v-8m0 0l3 3m-3-3l-3 3" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </button>
            </div>
        </header>

        <div class="admin-content">
            <!-- Key Metrics -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                            <rect x="3" y="6" width="18" height="15" rx="2" stroke="white" stroke-width="2" />
                            <path d="M8 3v6M16 3v6M3 10h18" stroke="white" stroke-width="2" stroke-linecap="round" />
                        </svg>
                    </div>
                    <div class="stat-details">
                        <span class="stat-label">Total Bookings</span>
                        <span class="stat-value">148</span>
                        <span class="stat-change positive">+24% vs last period</span>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon" style="background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                            <path d="M12 2L2 7l10 5 10-5-10-5z" stroke="white" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" />
                            <path d="M2 17l10 5 10-5M2 12l10 5 10-5" stroke="white" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </div>
                    <div class="stat-details">
                        <span class="stat-label">Revenue</span>
                        <span class="stat-value">₹8.4L</span>
                        <span class="stat-change positive">+15% vs last period</span>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                            <path d="M3 12l6 6L21 6" stroke="white" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg>
                    </div>
                    <div class="stat-details">
                        <span class="stat-label">Conversion Rate</span>
                        <span class="stat-value">64%</span>
                        <span class="stat-change neutral">-2% vs last period</span>
                    </div>
                </div>
            </div>

            <!-- Charts Grid -->
            <div class="dashboard-grid">
                <div class="dashboard-card" style="grid-column: span 2;">
                    <div class="card-header">
                        <h2 class="card-title">Booking Trends</h2>
                    </div>
                    <div style="height: 300px;">
                        <canvas id="bookingsChart"></canvas>
                    </div>
                </div>
            </div>

            <div class="dashboard-grid">
                <div class="dashboard-card">
                    <div class="card-header">
                        <h2 class="card-title">Service Popularity</h2>
                    </div>
                    <div style="height: 250px;">
                        <canvas id="servicesChart"></canvas>
                    </div>
                </div>

                <div class="dashboard-card">
                    <div class="card-header">
                        <h2 class="card-title">Traffic Sources</h2>
                    </div>
                    <div style="height: 250px;">
                        <canvas id="sourcesChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="admin-script.js"></script>
    <script>
        // Set page context
        document.body.setAttribute('data-page', 'analytics');

        // Mobile toggle
        function toggleSidebar() {
            document.getElementById('adminSidebar').classList.toggle('open');
        }

        function exportReport() {
            showNotification('Generating PDF report...', 'info');
            setTimeout(() => {
                showNotification('Report downloaded!', 'success');
            }, 2000);
        }

        // Initialize Charts (Mock Data)
        document.addEventListener('DOMContentLoaded', () => {
            // Bookings Line Chart
            const ctxBookings = document.getElementById('bookingsChart').getContext('2d');
            new Chart(ctxBookings, {
                type: 'line',
                data: {
                    labels: ['Jan 1', 'Jan 5', 'Jan 10', 'Jan 15', 'Jan 20', 'Jan 25', 'Jan 30'],
                    datasets: [{
                        label: 'Bookings',
                        data: [12, 19, 15, 25, 22, 30, 24],
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    }
                }
            });

            // Services Pie Chart
            const ctxServices = document.getElementById('servicesChart').getContext('2d');
            new Chart(ctxServices, {
                type: 'doughnut',
                data: {
                    labels: ['Starter', 'Professional', 'Business'],
                    datasets: [{
                        data: [30, 45, 25],
                        backgroundColor: ['#43e97b', '#667eea', '#f5576c']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false
                }
            });

            // Sources Bar Chart
            const ctxSources = document.getElementById('sourcesChart').getContext('2d');
            new Chart(ctxSources, {
                type: 'bar',
                data: {
                    labels: ['Direct', 'Social', 'Referral', 'Email'],
                    datasets: [{
                        label: 'Visitors',
                        data: [300, 250, 180, 120],
                        backgroundColor: '#f093fb',
                        borderRadius: 5
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    }
                }
            });
        });
    </script>
</body>

</html>
