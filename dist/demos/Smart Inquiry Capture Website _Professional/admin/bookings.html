<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookings - Smart Inquiry Admin</title>
    <link rel="stylesheet" href="admin-styles.css">
    <script src="../advanced-protection.js"></script>
</head>

<body data-page="bookings">
    <!-- Sidebar -->
    <aside class="admin-sidebar" id="adminSidebar">
        <div class="sidebar-header">
            <h2>Smart Inquiry</h2>
            <span class="badge-pro">PRO</span>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <path d="M3 7l7-5 7 5v11H3V7z" stroke="currentColor" stroke-width="2" />
                </svg>
                Dashboard
            </a>
            <a href="bookings.html" class="nav-item active">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <rect x="3" y="4" width="14" height="14" rx="2" stroke="currentColor" stroke-width="2" />
                </svg>
                Bookings
                <span class="nav-badge">12</span>
            </a>
            <a href="staff.html" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <path d="M16 17v-2a4 4 0 00-8 0v2M12 7a4 4 0 11-8 0 4 4 0 018 0z" stroke="currentColor"
                        stroke-width="2" />
                </svg>
                Staff
            </a>
            <a href="analytics.html" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <path d="M3 17V9M9 17V3M15 17v-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                </svg>
                Analytics
            </a>
            <a href="ai-settings.html" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <path d="M10 3v14M3 10h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                    <circle cx="10" cy="10" r="3" stroke="currentColor" stroke-width="2" />
                </svg>
                AI Settings
            </a>
            <a href="crm-sync.html" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <path d="M4 12v5h5M16 8V3h-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                    <path d="M16 3l-6 6M4 17l6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                </svg>
                CRM Sync
            </a>
            <a href="locations.html" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <path d="M10 10m-3 0a3 3 0 106 0 3 3 0 10-6 0" stroke="currentColor" stroke-width="2" />
                    <path d="M10 2c-3.866 0-7 3.134-7 7 0 5.25 7 11 7 11s7-5.75 7-11c0-3.866-3.134-7-7-7z"
                        stroke="currentColor" stroke-width="2" />
                </svg>
                Locations
            </a>
            <a href="team-roles.html" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <path d="M14 6a4 4 0 11-8 0 4 4 0 018 0zM3 18a7 7 0 0114 0" stroke="currentColor"
                        stroke-width="2" />
                </svg>
                Team & Roles
            </a>
            <a href="whatsapp-templates.html" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <path d="M17 3H3v11h4l3 3 3-3h4V3zM7 8h6M7 11h4" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" />
                </svg>
                WhatsApp
            </a>
            <a href="settings.html" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <path
                        d="M10 12a2 2 0 100-4 2 2 0 000 4zM10 3v2m0 10v2m7-7h-2M5 10H3m12.07-5.07l-1.41 1.41M6.34 13.66l-1.41 1.41m9.9 0l-1.41-1.41M6.34 6.34L4.93 4.93"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                </svg>
                Settings
            </a>
        </nav>
        <button class="sidebar-logout" onclick="logout()">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                <path d="M7 17H3V3h4M13 13l4-3-4-3M17 10H7" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" />
            </svg>
            Logout
        </button>
    </aside>

    <!-- Main Content -->
    <main class="admin-main">
        <header class="admin-header">
            <button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
            <h1>Bookings Management</h1>
            <div class="header-actions">
                <div class="search-box">
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                        <circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="2" />
                        <path d="M12 12l4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                    </svg>
                    <input type="text" placeholder="Search bookings..." class="search-input">
                </div>
                <button class="btn-primary" onclick="showNotification('Create booking feature coming soon!', 'info')">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                        <path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                    </svg>
                    New Booking
                </button>
            </div>
        </header>

        <div class="admin-content">
            <!-- Filter Tabs -->
            <div class="filter-tabs-modern">
                <button class="filter-tab active" data-filter="all">
                    <span>All Bookings</span>
                    <span class="tab-count">24</span>
                </button>
                <button class="filter-tab" data-filter="pending">
                    <span>Pending</span>
                    <span class="tab-count">12</span>
                </button>
                <button class="filter-tab" data-filter="confirmed">
                    <span>Confirmed</span>
                    <span class="tab-count">8</span>
                </button>
                <button class="filter-tab" data-filter="completed">
                    <span>Completed</span>
                    <span class="tab-count">3</span>
                </button>
                <button class="filter-tab" data-filter="cancelled">
                    <span>Cancelled</span>
                    <span class="tab-count">1</span>
                </button>
            </div>

            <!-- Bookings Grid -->
            <div class="bookings-grid" id="bookingsGrid">
                <!-- Populated by JavaScript -->
            </div>
        </div>
    </main>

    <script src="admin-script.js"></script>
    <script>
        // Filter tabs interaction
        document.querySelectorAll('.filter-tab').forEach(tab => {
            tab.addEventListener('click', function () {
                document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                showNotification(`Filtering: ${this.dataset.filter}`, 'info');
            });
        });
    </script>
</body>

</html>
