<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Config Demo Example</title>

    <!-- Include Taliyo Scripts -->
    <script src="../common/config.js"></script>
    <script src="../common/redirect.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 36px;
            margin-bottom: 20px;
            text-align: center;
        }

        .config-display {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
        }

        .config-item {
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .config-item:last-child {
            border-bottom: none;
        }

        .config-key {
            font-weight: bold;
            color: #fbbf24;
        }

        .config-value {
            margin-left: 10px;
            color: #a7f3d0;
        }

        .instructions {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            margin-top: 20px;
        }

        .instructions h3 {
            margin-bottom: 10px;
            color: #fbbf24;
        }

        .instructions code {
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
        }

        .loading {
            text-align: center;
            font-style: italic;
            opacity: 0.7;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🔧 Config Demo</h1>

        <div class="config-display" id="configDisplay">
            <div class="loading">Loading configuration...</div>
        </div>

        <div class="instructions">
            <h3>📝 How to Use:</h3>
            <ol>
                <li>Go to <strong>Admin Panel</strong></li>
                <li>Click <strong>"Config"</strong> on this demo</li>
                <li>Add variables like:
                    <ul>
                        <li><code>BRAND_NAME</code> = Your Company</li>
                        <li><code>API_URL</code> = https://api.example.com</li>
                        <li><code>THEME_COLOR</code> = #6366f1</li>
                    </ul>
                </li>
                <li>Click <strong>"Save"</strong></li>
                <li><strong>Refresh this page</strong> to see your config!</li>
            </ol>
        </div>
    </div>

    <script>
        // Listen for config loaded event
        window.addEventListener('taliyoConfigLoaded', (event) => {
            const config = event.detail;
            const display = document.getElementById('configDisplay');

            // Check if config is empty
            if (Object.keys(config).length === 0) {
                display.innerHTML = `
                    <div class="loading">
                        No config found! Use the Admin Panel to add some variables.
                    </div>
                `;
                return;
            }

            // Display all config values
            let html = '<h3 style="margin-bottom: 15px;">Current Config:</h3>';

            for (const [key, value] of Object.entries(config)) {
                html += `
                    <div class="config-item">
                        <span class="config-key">${key}:</span>
                        <span class="config-value">${value}</span>
                    </div>
                `;
            }

            display.innerHTML = html;

            // Example: Apply theme color if set
            if (config.THEME_COLOR) {
                document.body.style.background = `linear-gradient(135deg, ${config.THEME_COLOR} 0%, #764ba2 100%)`;
            }

            // Example: Update title if brand name is set
            if (config.BRAND_NAME) {
                document.title = `${config.BRAND_NAME} - Config Demo`;
            }
        });
    </script>
</body>

</html>
